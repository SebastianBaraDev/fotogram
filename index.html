<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

     <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="./font.css">
     <script src="./function.js"></script>
     <link rel="icon" type="image/png" href="./img/favicon.png">
</head>
<body>
     <main>
        <header>
            <img src="./img/header_logo.svg" alt="Fotogram Logo" id="header_logo">
        </header>

        <h1>Unser Dialog Test</h1>
        <button aria-haspopup="dialog" aria-controls="myDialog" onclick="openDialog()">Dialog öffnen</button>
            <dialog id="myDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescrib">
                <header>
                    <h2 id="dialogTitle">Dialog Titel</h2>
                </header>
                <section>
                    <p id="dialogDescrib">Dies ist ein Beispiel für einen ARIA Dialog.</p>
                </section>
                <footer>
                <button aria-label="Dialog schließen" onclick="closeDialog()">Dialog schließen</button>
                </footer>
            </dialog>
    </main>

    <footer>
            <img src="./img/footer_background.png" alt="Fotogram Footer Logo" id="footer_logo">
    </footer>
    
</body>
</html>
